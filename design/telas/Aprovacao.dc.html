<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Play.Me · Aprovação</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="playme-tokens.css">
<link rel="stylesheet" href="ds/playme/components/bundle.css">
<script src="ds/playme/components/lib/thinking-orbs.js"></script>
<script src="ds/playme/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: var(--surface-base); color: var(--ink); font-family: var(--font-sans)">
<dc-import name="Sidebar" active="eletro" theme="{{theme}}" hint-size="264px,900px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line)">
<span style="font-size: 15px; line-height: 24px; font-weight: 500">Eletro · warm up → peak</span>
<span style="font: 500 11px/16px var(--font-mono); padding: 2px 6px; border-radius: 6px; background: var(--surface-overlay); color: var(--ink-muted)">V1</span>
<span style="flex-grow: 1"></span>
<x-import component-from-global-scope="PlayMe.Button" variant="outline" size="sm" icon="list">Painel do set</x-import>
</header>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 32px 28px 0">
<div style="width: 720px; display: flex; flex-direction: column; gap: 24px">
<x-import component-from-global-scope="PlayMe.ChatMessage" role="assistant">
<p style="color: var(--ink-muted)">A passagem mais arriscada é a saída do clímax: cai 6 BPM de uma vez. Fora do set: Cruisin' e This Rhythm.</p>
</x-import>
<x-import component-from-global-scope="PlayMe.ChatMessage" role="user">Tá bom assim. Pode mandar pro Spotify.</x-import>
<x-import component-from-global-scope="PlayMe.ChatMessage" role="assistant">
<p>Pronto para enviar. A playlist nova sai com as 21 faixas na ordem do painel.</p>
<x-import component-from-global-scope="PlayMe.ApprovalGate" playlist-name="[DJ MIX] Eletro" track-count="{{n21}}"></x-import>
<div style="display: flex">
<x-import component-from-global-scope="PlayMe.ToolCall" name="spotify_create_playlist_from_order" detail="21 faixas · privada" status="waiting"></x-import>
</div>
</x-import>
</div>
</div>
<div style="display: flex; justify-content: center; padding: 16px 28px 24px">
<div style="width: 720px; box-shadow: var(--shadow-float); border-radius: 20px">
<x-import component-from-global-scope="PlayMe.Composer" id="aprovacao-composer" context="Eletro · set V1" placeholder="Ou peça mais um ajuste antes de enviar"></x-import>
</div>
</div>
</main>
<dc-import name="SetPanel" tab="ordem" version="V1" status="aprovacao" theme="{{theme}}" hint-size="400px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', n21: 21 };
  }
}
</script>
</body>
</html>
