[project]
name = "playme-analyzer"
version = "0.0.1"
description = "Play.Me audio analyzer (local FastAPI service)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"  # venv is 3.12 (D18); numpy>=2.5 stubs need it
strict = true
files = ["analyzer", "tests"]

[[tool.mypy.overrides]]
module = ["torch", "beat_this.*"]
ignore_missing_imports = true
